spring:
  application:
    name: attendance-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # Default to local (H2)
  servlet:
    multipart:
      max-file-size: 5MB  # Increased for documents
      max-request-size: 5MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# JPA Configuration (common)
jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      format_sql: true
      dialect: auto

# App specific
app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long-for-security}
    expiration: ${JWT_EXPIRATION:1800000}  # 30 minutes
  
  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-size: 5242880  # 5MB in bytes for documents