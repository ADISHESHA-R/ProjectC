spring:
  application:
    name: attendance-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # Default to local (H2)

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# JPA Configuration (common)
jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      format_sql: true
      dialect: auto

# App specific
app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours
  
  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
