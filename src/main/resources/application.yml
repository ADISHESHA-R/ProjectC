spring:
  application:
    name: attendance-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # Default to local (H2)
  datasource:
    url: jdbc:h2:mem:attendancedb
    username: sa
    password:
  h2:
    console:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB  # Increased for documents
      max-request-size: 5MB

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# JPA Configuration (common)
jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      format_sql: true
      dialect: auto
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# App specific
app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long-for-security}
    expiration: ${JWT_EXPIRATION:1800000}  # 30 minutes

  public-feedback-token-valid-days: ${PUBLIC_FEEDBACK_TOKEN_VALID_DAYS:30}
  public-feedback-rate-limit-per-minute: ${PUBLIC_FEEDBACK_RATE_LIMIT_PER_MINUTE:120}

  # CORS: optional comma-separated origins for dev/prod (e.g. https://myapp.vercel.app). If not set, localhost origins are used.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  file:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-size: 5242880  # 5MB in bytes for documents