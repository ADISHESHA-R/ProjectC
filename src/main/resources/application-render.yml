# Render deployment - PostgreSQL (shared database)
# Optional: set CORS_ALLOWED_ORIGINS env var to your frontend URL(s), comma-separated (e.g. https://myapp.onrender.com)
spring:
  datasource:
    # DATABASE_URL: JDBC URL with HOST only in the authority — do NOT use
    # jdbc:postgresql://USER:PASSWORD@host/... (PG JDBC misparses that; "host" becomes USER:PASSWORD@host).
    # Either omit DATABASE_URL and use DB_* below, or set e.g.
    # jdbc:postgresql://HOST:5432/DB?sslmode=require&user=USER&password=PASS
    # DB_HOST: Render "internal" host is often only dpg-…-a; if you get UnknownHostException,
    # use the full host from External Database URL (…-postgres.render.com), same region as the DB.
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&connectTimeout=10&socketTimeout=30}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000  # 60 seconds (longer for external connections)
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000  # 5 minutes
      max-lifetime: 600000  # 10 minutes
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
  
  h2:
    console:
      enabled: false  # Disable H2 console on Render

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # Update schema automatically
    show-sql: false
    properties:
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
          implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Logging for Render
logging:
  level:
    root: INFO
    org.hibernate: INFO
    com.attendance: INFO
    com.zaxxer.hikari: WARN  # Set to DEBUG for connection pool debugging if needed