# Render deployment - PostgreSQL (shared database)
# Optional: set CORS_ALLOWED_ORIGINS env var to your frontend URL(s), comma-separated (e.g. https://myapp.onrender.com)
spring:
  datasource:
    # Support both DATABASE_URL (full JDBC URL) or individual components
    # If DATABASE_URL is set, use it directly; otherwise construct from components
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&connectTimeout=10&socketTimeout=30}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000  # 60 seconds (longer for external connections)
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000  # 5 minutes
      max-lifetime: 600000  # 10 minutes
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
  
  h2:
    console:
      enabled: false  # Disable H2 console on Render

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # Update schema automatically
    show-sql: false
    properties:
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
          implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Logging for Render
logging:
  level:
    root: INFO
    org.hibernate: INFO
    com.attendance: INFO
    com.zaxxer.hikari: WARN  # Set to DEBUG for connection pool debugging if needed