# Render deployment - PostgreSQL (shared database)
# Optional: set CORS_ALLOWED_ORIGINS env var to your frontend URL(s), comma-separated (e.g. https://myapp.onrender.com)
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  h2:
    console:
      enabled: false  # Disable H2 console on Render

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # Update schema automatically
    show-sql: false
    properties:
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
          implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Logging for Render
logging:
  level:
    root: INFO
    org.hibernate: INFO
    com.attendance: INFO
