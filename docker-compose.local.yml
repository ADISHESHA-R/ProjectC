version: '3.8'

# Local Development - H2 Database (No external DB needed)
services:
  attendance-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-backend-local
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - PORT=8080
      - JWT_SECRET=local-dev-secret-key
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  attendance-network:
    driver: bridge
