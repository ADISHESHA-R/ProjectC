version: '3.8'

services:
  # Local Development Service (H2 Database)
  attendance-backend-local:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-backend-local
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - PORT=8080
      - JWT_SECRET=local-dev-secret-key
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Development Service (PostgreSQL - for testing with DB)
  attendance-backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-backend-dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=render
      - PORT=8080
      - DB_HOST=your-db-host.onrender.com
      - DB_PORT=5432
      - DB_NAME=attendance_db
      - DB_USERNAME=your-username
      - DB_PASSWORD=your-password
      - JWT_SECRET=dev-secret-key
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    profiles:
      - dev

  # QA Service (PostgreSQL)
  attendance-backend-qa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-backend-qa
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=render
      - PORT=8080
      - DB_HOST=your-db-host.onrender.com
      - DB_PORT=5432
      - DB_NAME=attendance_db
      - DB_USERNAME=your-username
      - DB_PASSWORD=your-password
      - JWT_SECRET=qa-secret-key
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    profiles:
      - qa

  # Production Service (PostgreSQL)
  attendance-backend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance-backend-prod
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=render
      - PORT=8080
      - DB_HOST=your-db-host.onrender.com
      - DB_PORT=5432
      - DB_NAME=attendance_db
      - DB_USERNAME=your-username
      - DB_PASSWORD=your-password
      - JWT_SECRET=prod-secret-key
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    profiles:
      - prod

networks:
  attendance-network:
    driver: bridge
